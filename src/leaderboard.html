<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050607">
<title>High Scores · BRICKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

:root{color-scheme:dark;font-family:'Press Start 2P',ui-monospace,monospace}
*{box-sizing:border-box}
html{min-width:320px}
body{--bg:#030504;--ink:#d7e0dc;--quiet:#84958e;--dim:#62736d;--line:#33423c;--accent:#b8d9c9;margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse 80% 52% at 50% 9%,#101915 0%,#070b09 55%,var(--bg) 100%);font-size:12px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.pixel{font-family:"Press Start 2P",ui-monospace,monospace}
#crt{position:fixed;inset:0;z-index:8;pointer-events:none;background:repeating-linear-gradient(to bottom,#0005 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 49%,#0009 100%);opacity:.58;mix-blend-mode:multiply}
#crt::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,#d8eee508 50%,transparent 55%);background-size:100% 22%;background-repeat:no-repeat;animation:scan 12s linear infinite}
@keyframes scan{from{background-position:0 -25%}to{background-position:0 125%}}
main{position:relative;z-index:1;width:min(100%,720px);margin:0 auto;padding:clamp(16px,3vw,30px) clamp(16px,4vw,36px) 56px}
.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #ffffff0c}
.back,.play{min-width:46px;min-height:42px;display:inline-flex;align-items:center;color:var(--quiet);font-size:11px;letter-spacing:.08em}
.back{font-size:21px}
.play{justify-content:flex-end}
.back:hover,.play:hover{color:var(--accent)}
.brand{font-size:9px;letter-spacing:.08em;color:var(--quiet);white-space:nowrap}
.hero{padding:clamp(34px,7vh,64px) 0 24px;text-align:center}
h1{margin:0;color:var(--ink);font-size:clamp(15px,3vw,20px);line-height:1.7;letter-spacing:.11em;font-weight:400;text-shadow:0 0 22px #d8eee51b}
.metric-tabs{display:grid;grid-template-columns:1fr 1fr;width:min(100%,254px);margin:20px auto 0;border-bottom:1px solid var(--line)}
.metric-tabs button{min-height:42px;padding:9px 12px;color:var(--dim);border:0;border-bottom:1px solid transparent;background:transparent;font-size:9px;letter-spacing:.12em}
.metric-tabs button:hover{color:var(--ink)}
.metric-tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 18px #b8d9c91c}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:18px 0 22px;border-bottom:1px solid var(--line)}
.stat{margin:0;min-width:0}
.stat dt{color:var(--dim);font-size:8px;letter-spacing:.08em;margin:0 0 10px;line-height:1.6}
.stat dd{margin:0;color:var(--ink);font-size:clamp(12px,2.3vw,17px);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.01em}
.board-top{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.board-title{font-size:10px;letter-spacing:.14em;color:var(--quiet);font-weight:400}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;color:var(--quiet);border:0;background:transparent;font-size:19px}
.icon-btn:hover{color:var(--accent)}
.board-head,.entry{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(76px,108px);align-items:center;gap:10px}
.board-head{padding:10px 0;color:var(--dim);font-size:8px;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.entry{min-height:64px;padding:12px 0;border-bottom:1px solid #ffffff11;font-size:11px;transition:background .2s}
.entry:hover{background:#c2e3d106}
.entry.mine{border-left:1px solid var(--accent);padding-left:7px}
.rank{color:var(--dim);font-variant-numeric:tabular-nums;font-size:9px;white-space:nowrap}
.name{min-width:0;color:var(--ink);line-height:1.6;overflow-wrap:break-word}
.board-seed{display:block;font-size:8px;line-height:1.6;margin-top:4px;color:var(--dim);font-weight:400}
.me-tag{margin-left:8px;font-size:9px;color:var(--accent)}
.value{text-align:right;white-space:nowrap;font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums}
.entry.first .value{color:var(--accent)}
.empty{padding:52px 12px;text-align:center;color:var(--quiet)}
.empty h3{font-size:10px;letter-spacing:.1em;font-weight:400;line-height:2;margin:0 0 22px}
.empty .play-empty{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 15px;border:1px solid var(--line);font-size:10px;letter-spacing:.1em;color:var(--accent)}
.empty .play-empty:hover{border-color:var(--accent)}
.loadFooter{display:flex;justify-content:center;padding:16px 0}
.loadFooter button{min-width:100px;min-height:44px;border:1px solid var(--line);background:transparent;color:var(--quiet);font-size:10px;letter-spacing:.13em}
.loadFooter button:hover{color:var(--accent);border-color:var(--accent)}
.loadFooter [hidden]{display:none}
.foot{display:flex;justify-content:flex-end;min-height:20px}
.state{font-size:9px;letter-spacing:.1em;color:var(--dim)}
@media(max-width:520px){
 main{padding:14px 16px 48px}
 .hero{padding:36px 0 18px}
 h1{font-size:clamp(13px,3.7vw,17px)}
 .brand{font-size:8px}
 .stats{gap:8px;padding:17px 0 18px}
 .stat dt{font-size:7px}
 .stat dd{font-size:clamp(10px,2.9vw,13px)}
 .board-head,.entry{grid-template-columns:34px minmax(0,1fr) 84px;gap:8px}
 .board-head{padding:10px 0}
 .entry{padding:12px 0}
 .entry.mine{padding-left:0}
 .name,.value{font-size:10px}
 .board-seed{font-size:7px}
}
@media(prefers-reduced-motion:reduce){#crt::after{animation:none}.entry{transition:none}}


/* Shared CRT glass: text and overlays are part of the same display. */
html,body,body *{font-family:'Press Start 2P',ui-monospace,monospace!important}
#crt{
 display:block;position:fixed;inset:0;z-index:60;pointer-events:none;
 border-radius:4% / 3%;opacity:1;
 background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.27) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(90deg,rgba(255,92,82,.016) 0 1px,rgba(86,255,168,.014) 1px 2px,rgba(88,138,255,.016) 2px 3px),
  radial-gradient(ellipse 82% 74% at 50% 46%,transparent 43%,rgba(0,0,0,.14) 70%,rgba(0,0,0,.66) 100%);
 box-shadow:inset 0 0 0 1px #c2f1d20f,inset 0 0 30px #0007,inset 0 0 105px 12px #0008;
 mix-blend-mode:normal;
 animation:crtGlassFlicker 8s steps(16,end) infinite;
}
#crt::before{
 content:'';position:absolute;inset:0;border-radius:inherit;
 background:radial-gradient(ellipse 78% 55% at 50% -10%,#c9fbe010,transparent 88%);
 box-shadow:inset 0 2px 10px #cfffe00b,inset 0 -5px 25px #0005;
}
#crt::after{
 content:'';position:absolute;inset:0;border-radius:inherit;
 background:linear-gradient(to bottom,transparent 42%,#d2f9e30b 50%,transparent 58%);
 background-size:100% 19%;background-repeat:no-repeat;
 transform:skewY(-.18deg);filter:blur(.35px);
 animation:crtGlassRoll 13s linear infinite;
}
@keyframes crtGlassFlicker{0%,19%,22%,100%{opacity:1}20%{opacity:.94}21%{opacity:.98}}
@keyframes crtGlassRoll{from{background-position:0 -25%}to{background-position:0 125%}}
@media(prefers-reduced-motion:reduce){#crt{display:block!important;animation:none!important}#crt::after{animation:none!important}}

body{text-shadow:0 0 5px #b8eadb19}
.board-head,.entry{line-height:1.6}
.entry{min-height:64px}
.board-seed{line-height:1.6}
@media(max-width:520px){
 .board-head,.entry{grid-template-columns:34px minmax(0,1fr) 84px}
 .value{font-size:10px;letter-spacing:-.025em}
 .name{font-size:10px}
 .board-seed{font-size:7px}
}
@media(max-width:420px){
 .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
 .stat dt{font-size:7px;letter-spacing:0}
 .stat dd{font-size:10px}
}
 .stat:last-child{grid-column:1/-1}
 .stat dd{font-size:12px}
}
</style></head>

<body>
<div id="crt" aria-hidden="true"></div>
<main>
<header class="top">
 <a class="back" href="/" aria-label="Back to game" title="Back to game">←</a>
 <span class="brand pixel">BRICKS</span>
 <a class="play" id="play" href="/">PLAY</a>
</header>
<section class="hero"><h1 class="pixel">HIGH SCORES</h1>
 <div class="metric-tabs" role="group" aria-label="Leaderboard category">
  <button id="bestTime" type="button" aria-label="Best time" aria-pressed="true">TIME</button>
  <button id="bestScore" type="button" aria-label="Best score" aria-pressed="false">SCORE</button>
 </div>
</section>
<section aria-label="World rankings" id="rankingArea">
 <dl class="stats">
  <div class="stat"><dt id="bestLabel">BEST TIME</dt><dd id="fastest">--:--</dd></div>
  <div class="stat"><dt>PLAYERS</dt><dd id="players">--</dd></div>
  <div class="stat"><dt>YOUR BEST</dt><dd id="mine">--:--</dd></div>
 </dl>
 <div class="board-top">
  <span class="board-title">WORLD</span>
  <button class="icon-btn" type="button" id="refresh" aria-label="Refresh rankings" title="Refresh rankings">↻</button>
 </div>
 <div class="board">
  <div class="board-head"><span>#</span><span>PLAYER</span><span id="valueLabel" style="text-align:right">TIME</span></div>
  <div id="rows" aria-live="polite"></div>
 </div>
 <div class="loadFooter"><button id="more" type="button" hidden>MORE</button></div>
 <div class="foot"><span class="state" id="updated" role="status" aria-live="polite">○ READY</span></div>
</section>
</main>
<script>
(()=>{
const P=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let metric=params.get('metric')==='time'?'time':'score';
let localScore={};try{localScore=JSON.parse(localStorage.getItem('brick-asmr-high-scores')||'{}')||{};}catch{}
const seed=/^[a-z0-9]{1,16}$/.test(params.get('seed')||'')?params.get('seed'):'d'+new Date().toISOString().slice(0,10).replace(/-/g,'');
const arenaParam=params.get('arena')||'';
const arenaWidth=/^\d{3,4}$/.test(arenaParam)?Number(arenaParam):360;
const game=new URL('/?arena='+arenaWidth,location.origin);game.hash=seed;
document.querySelector('.back').href=game.pathname+game.search+game.hash;
P('play').href=game.pathname+game.search+game.hash;
let playerId='',localBest={};
try{playerId=localStorage.getItem('brick-asmr-player-id')||'';localBest=JSON.parse(localStorage.getItem('brick-asmr-best')||'{}')||{};}catch{}
const fmt=ms=>{const m=Math.floor(ms/60000),s=(ms-m*60000)/1000;return m+':'+(s<10?'0':'')+s.toFixed(2)};
const isV4Key=key=>/^[a-z0-9]{1,16}-v4-(?:clean|vintage|vapor)(?:-a\d{3,4})?$/.test(key);
const best=Math.min(Infinity,...Object.entries(localBest).filter(([key,value])=>isV4Key(key)&&Number.isFinite(value)).map(([,value])=>value));
const scoreBest=Math.max(0,...Object.entries(localScore).filter(([key,value])=>isV4Key(key)&&Number.isFinite(value)).map(([,value])=>value));
const metricValue=r=>metric==='score'?Number(r.score||0).toLocaleString():fmt(r.timeMs);
function updateMetricLabels(){
 P('bestTime').setAttribute('aria-pressed',String(metric==='time'));
 P('bestScore').setAttribute('aria-pressed',String(metric==='score'));
 P('bestLabel').textContent=metric==='score'?'TOP SCORE':'BEST TIME';
 P('valueLabel').textContent=metric==='score'?'SCORE':'TIME';
 P('mine').textContent=metric==='score'?(scoreBest?scoreBest.toLocaleString():'--'):(Number.isFinite(best)?fmt(best):'--:--');
 P('fastest').textContent=metric==='score'?'--':'--:--';
}
updateMetricLabels();
const cell=(cls,text)=>{const n=document.createElement('div');n.className=cls;n.textContent=text;return n};
function boardLabel(key){
 const m=/^([a-z0-9]+?)(?:-\d+)?-v4-(?:clean|vintage|vapor)(?:-a\d{3,4})?$/.exec(key||'');
 if(!m)return 'SEED '+String(key||'').replace(/-(?:clean|vintage|vapor)(?:-a\d{3,4})?$/,'').toUpperCase();
 const label=m[1].startsWith('d20')?'DAILY '+m[1].slice(5):'SEED '+m[1].toUpperCase();
 return label;
}
function empty(title){
 const shell=cell('empty','');
 const heading=document.createElement('h3');heading.className='pixel';heading.textContent=title;
 shell.append(heading);
 if(title==='NO TIMES'||title==='NO SCORES'){const a=document.createElement('a');a.className='play-empty';a.href=P('play').href;a.textContent='PLAY';shell.append(a);}
 P('rows').append(shell);
}
let offset=0,hasMore=false,loading=false,run=0;
function renderRows(entries,first,personal){
 if(first){
  P('rows').replaceChildren();
  P('fastest').textContent=entries.length?metricValue(entries[0]):(metric==='score'?'--':'--:--');
  if(!entries.length){empty(metric==='score'?'NO SCORES':'NO TIMES');return;}
 }
 if(first&&personal&&!entries.some(r=>r.playerId===playerId)){
  const mine=cell('entry mine',''),label=cell('name',personal.name);
  label.append(cell('board-seed',boardLabel(personal.boardKey)));
  label.append(cell('me-tag','YOU'));
  mine.append(cell('rank','YOU'),label,cell('value',metricValue(personal)));
  P('rows').append(mine);
 }
 for(const [i,r] of entries.entries()){
  const rank=offset+i+1;
  const item=cell('entry'+(rank===1?' first':'')+(r.playerId===playerId?' mine':''),'');
  const user=cell('name',r.name);
  user.append(cell('board-seed',boardLabel(r.boardKey)+(metric==='score'?' · '+r.bricksBroken+' BRICKS · '+r.bestCombo+'×':'')));
  if(r.playerId===playerId)user.append(cell('me-tag','YOU'));
  item.append(cell('rank','#'+String(rank).padStart(2,'0')),user,cell('value',metricValue(r)));
  P('rows').append(item);
 }
}
async function load(reset=false){
 if(loading&&!reset)return;
 const call=++run;
 loading=true;
 if(reset){
  offset=0;
  P('rows').replaceChildren();
  empty('…');
 }
 P('refresh').disabled=true;P('more').disabled=true;P('updated').textContent='◌ SYNC';
 try{
  const res=await fetch('/api/leaderboard?scope=world&offset='+offset+'&metric='+metric+'&playerId='+encodeURIComponent(playerId),{cache:'no-store'});
  if(!res.ok)throw Error('Network error');
  const data=await res.json();
  if(call!==run)return;
  const entries=Array.isArray(data.entries)?data.entries:[];
  renderRows(entries,offset===0,data.personal||null);
  if(data.personal)P('mine').textContent=metricValue(data.personal);
  P('players').textContent=Number(data.totalPlayers||0).toLocaleString();
  offset+=entries.length;
  hasMore=Boolean(data.hasMore);
  P('more').hidden=!hasMore;
  P('updated').textContent='● SYNCED';
 }catch(e){
  if(call===run){
   if(offset===0){P('rows').replaceChildren();empty('OFFLINE');}
   P('updated').textContent='○ OFFLINE';
  }
 }finally{
  if(call===run){loading=false;P('refresh').disabled=false;P('more').disabled=false;}
 }
}
function setMetric(next){
 if(next===metric)return;
 metric=next;const u=new URL(location.href);u.searchParams.set('metric',metric);history.replaceState(null,'',u.pathname+u.search);
 updateMetricLabels();load(true);
}
P('bestTime').onclick=()=>setMetric('time');
P('bestScore').onclick=()=>setMetric('score');
const ranking=P('rankingArea');
let startX=null,startY=null;
ranking.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;}},{passive:true});
ranking.addEventListener('touchend',e=>{
 if(startX===null||!e.changedTouches.length)return;
 const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
 startX=startY=null;
 if(Math.abs(dx)>=65&&Math.abs(dx)>Math.abs(dy)*1.5)setMetric(dx<0?'score':'time');
},{passive:true});
ranking.addEventListener('keydown',e=>{
 if(e.target.tagName==='BUTTON'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
  e.preventDefault();setMetric(e.key==='ArrowRight'?'score':'time');P(e.key==='ArrowRight'?'bestScore':'bestTime').focus();
 }
});
P('refresh').onclick=()=>load(true);
P('more').onclick=()=>load();
load(true);
})();
</script>
</body>
</html>
